# Smartefact reusable GitHub workflow - CI

name: CI

on:

  workflow_call:
    inputs:
      java-version:
        type: number
        description: Java version
        required: false
        default: 21

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout sources
        id: checkout
        uses: actions/checkout@v7
        # Reference: https://github.com/actions/checkout
        with:
          submodules: recursive
      - name: Setup Java
        id: setup-java
        uses: actions/setup-java@v6
        # Reference: https://github.com/actions/setup-java
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache-jdk: true
          # NOTE: `cache: gradle` is not used, as the Gradle cache is managed by the `setup-gradle` action
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Setup Gradle
        id: setup-gradle
        uses: gradle/actions/setup-gradle@v6
        # Reference: https://github.com/gradle/actions/blob/main/docs/setup-gradle.md
        with:
          validate-wrappers: true
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: always
          build-scan-publish: false
      - name: Build
        run: ./gradlew build
      - name: Publish unit test reports
        if: always()
        uses: mikepenz/action-junit-report@v6
        # Reference: https://github.com/marketplace/actions/junit-report-action
        with:
          check_name: 'Unit Test Report'
          report_paths: '**/build/test-results/test/TEST-*.xml'
          detailed_summary: true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        # Reference: https://github.com/actions/upload-artifact
        with:
          name: Test reports
          path: |
            **/build/test-results/*/TEST-*.xml
            **/build/reports/tests
          compression-level: 9
          retention-days: 30
